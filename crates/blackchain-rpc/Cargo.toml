[package]
name = "blackchain-rpc"
version = "0.1.0"
edition = "2021"
description = "HTTP REST and JSON-RPC API server for AI agents and developer tooling"

[dependencies]
blackchain-core = { path = "../blackchain-core" }
blackchain-crypto = { path = "../blackchain-crypto" }
blackchain-mempool = { path = "../blackchain-mempool" }
blackchain-storage = { path = "../blackchain-storage" }
blackchain-p2p = { path = "../blackchain-p2p" }
axum = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
